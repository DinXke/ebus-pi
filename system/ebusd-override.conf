# /etc/systemd/system/ebusd.service.d/ebuspi.conf
# ebusd in de voorgrond (log naar het journal in RAM), altijd herstarten, MQTT-wachtwoord uit een apart bestand.
[Unit]
StartLimitIntervalSec=0

[Service]
Type=simple
PIDFile=
EnvironmentFile=-/etc/default/ebusd
EnvironmentFile=-/etc/ebuspi/ebusd.env
ExecStart=
ExecStart=/usr/bin/ebusd --foreground $EBUSD_OPTS --mqttpass=${EBUSD_MQTTPASS}
Restart=always
RestartSec=10
